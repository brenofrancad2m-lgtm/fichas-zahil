<style>
  :root{
    --wine:#AD0C27;
    --gold:#C4A35A;
    --cream:#FAF7F5;
    --paper:#FFFFFF;
    --ink:#2B2627;
    --muted:#766B68;
    --line:rgba(43,38,39,.13);
    --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans:"Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{background:var(--cream);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
  main{flex:1}
  .wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 max(24px,env(safe-area-inset-left)) 0 max(24px,env(safe-area-inset-right))}

  header{padding:46px 0 0}
  .logo{display:block;height:44px;width:auto;margin-bottom:34px}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(2.6rem,6vw,4.2rem);line-height:1;color:var(--wine);text-transform:uppercase;letter-spacing:.005em}
  .sub{margin-top:14px;color:var(--muted);font-size:15.5px;max-width:46em}

  .tools{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:34px 0 10px}
  .search{position:relative;flex:1;min-width:260px}
  .search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:1.6}
  input[type=search]{
    width:100%;font:400 15.5px/1.4 var(--sans);color:var(--ink);
    background:var(--paper);border:1px solid var(--line);border-radius:999px;
    padding:14px 18px 14px 46px;outline:none;-webkit-appearance:none;
  }
  input[type=search]:focus{border-color:var(--wine)}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .filter{
    font:500 13.5px/1 var(--sans);color:var(--muted);background:transparent;
    border:1px solid var(--line);border-radius:999px;padding:11px 16px;cursor:pointer;transition:.18s;
  }
  .filter:hover{border-color:var(--wine);color:var(--wine)}
  .filter[aria-pressed="true"]{background:var(--wine);border-color:var(--wine);color:#fff}
  .count{color:var(--muted);font-size:13.5px;margin-bottom:24px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;padding-bottom:10px}
  .card{
    position:relative;display:grid;grid-template-columns:104px minmax(0,1fr);gap:18px;align-items:center;
    background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:22px;
    transition:border-color .18s, transform .18s, box-shadow .18s;
  }
  .card:hover{border-color:rgba(173,12,39,.45);transform:translateY(-2px);box-shadow:0 10px 28px rgba(43,38,39,.08)}
  .card img{width:100%;height:170px;object-fit:contain;display:block}
  .card h2{font-family:var(--serif);font-weight:500;font-size:1.6rem;line-height:1.15;color:var(--ink)}
  .card h2 a{color:inherit;text-decoration:none}
  .card h2 a::after{content:"";position:absolute;inset:0}
  .card .prod{font-size:14px;color:var(--muted);margin-top:4px}
  .card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .card .tag{font-size:12px;font-weight:500;color:#6B5424;background:rgba(196,163,90,.13);border:1px solid rgba(196,163,90,.5);border-radius:999px;padding:4px 10px}
  .card .nota{font-size:13px;color:var(--muted);margin-top:10px}
  .actions{position:relative;z-index:3;display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .act{position:relative;z-index:3;display:inline-flex;align-items:center;gap:6px;font:500 12.5px/1 var(--sans);color:var(--muted);background:var(--cream);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;transition:.18s}
  .act:hover{color:var(--wine);border-color:var(--wine)}
  .act svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  dialog{border:0;border-radius:16px;padding:0;max-width:92vw;width:380px;background:var(--paper);color:var(--ink);box-shadow:0 24px 60px rgba(43,38,39,.3)}
  dialog::backdrop{background:rgba(43,38,39,.55)}
  .modal{padding:28px 28px 24px;text-align:center}
  .modal h3{font-family:var(--serif);font-weight:500;font-size:1.5rem;line-height:1.2;margin-bottom:4px}
  .modal .u{font-size:12px;color:var(--muted);word-break:break-all;margin-bottom:18px}
  .modal img{width:100%;max-width:260px;height:auto;margin:0 auto 18px;display:block;border:1px solid var(--line);border-radius:10px}
  .modal .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{font:500 13.5px/1 var(--sans);border-radius:999px;padding:12px 18px;cursor:pointer;border:1px solid var(--wine);background:var(--wine);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:7px}
  .btn.ghost{background:transparent;color:var(--wine)}
  .btn:hover{opacity:.9}
  .catalogo-qr{display:inline-flex;align-items:center;gap:7px;font:500 13.5px/1 var(--sans);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:11px 16px;cursor:pointer;transition:.18s}
  .catalogo-qr:hover{color:var(--wine);border-color:var(--wine)}
  .catalogo-qr svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
  .empty{padding:60px 0;color:var(--muted);text-align:center}

  footer{margin-top:64px;flex:none;background:var(--wine);color:var(--cream)}
  footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-top:30px;padding-bottom:max(30px,env(safe-area-inset-bottom))}
  footer img{display:block;height:34px;width:auto}
  footer span{font-size:13px;color:rgba(250,247,245,.75)}
  footer .credito{font-size:12.5px;color:rgba(250,247,245,.6);width:100%;text-align:center;padding-top:14px;border-top:1px solid rgba(250,247,245,.18);margin-top:4px}

  @media (max-width:560px){
    header{padding-top:32px}
    .logo{height:36px;margin-bottom:24px}
    .grid{grid-template-columns:1fr}
    .card{grid-template-columns:86px minmax(0,1fr);gap:14px;padding:18px}
    .card img{height:140px}
    .card h2{font-size:1.4rem}
  }
  @media print{
    .tools,.actions,.count{display:none}
    body{background:#fff}
    .card{break-inside:avoid}
  }
</style>
</head>

const QR_CATALOGO = { nome: 'Catálogo de fichas Zahil', url: 'https://brenofrancad2m-lgtm.github.io/fichas-zahil/', qr: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA4QAAAOEAQMAAADDgG14AAAABlBMVEUrJif///+71icLAAAD8klEQVR42u3dQY7jIBAFUDQX4P639A0yUtqKgSozvTKM8lhE3QnxW2TzBQVVXg+PoxCJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSid8olnHUnxnlenmP66/3lPO99wPq5yV71I/4pzw9iEQikUgkfqfY5ZzaRqA251wpqOah6Mw+tQ07+ZPlHCKRSCQSiYtyzhVn2kwzLNFcqzjHJ/tc6z6zR8k5RCKRSCQSd8k5k68d4V85h0gkEolE4n+Uc67o0hbpxKqcUJ8j5xCJRCKRSNwt54TYE7esrvqcyTKQ+hwikUgkEolb5Zxh1GSJ5rcv8VFyDpFIJBKJxGU5JxvDptRwEGuoSG7Lku9PsvsdiUQikUgkLsg5XUwJcWbINHEZaNjGGubJOUQikUgkEpflnGx1JlQfDyXIpb9A8JVU75Q2PMk5RCKRSCQS1+Sc8okz16fd3cfZblX4tPRT1CETiUQikUjcIOfEHad5pXF2OCss6gybV3IOkUgkEonE53NO6GBV2w+G7an2u92lyPnul5xDJBKJRCJxbc4Zwk4MMWHdJ4tHpc9D7gkkEolEIpG4POe04aSc6abNLzWcwRoiTnZlspxDJBKJRCJxi5xzu+M0qz4OtyAfebsrOYdIJBKJROLCnFP6NZnSpptrcjYvT0vxUh45h0gkEolE4oqcc3sRTnZPYDvqpMun9RwikUgkEolb5JzYlTNr8Bnqi49QkZz1MJdziEQikUgkLsw58/Wc7K/aN74qfUFO1vNKziESiUQikfh8zsk7jZf86HnWAiu7HlnOIRKJRCKRuEHOyU9KlXZTKu/emV2xU+56mMs5RCKRSCQSF+Wc672h+jgEm9Knm3mnKzmHSCQSiUTi2pzzSq7+i4XH+deyxR99H4hEIpFIJO6Rc0KT8feok+wT4lHsdR7n+R2JRCKRSCQ+nnPyvaea3fWXz8tOXrk/h0gkEolE4gY55/w362XVTc4+DQ8o7VPkHCKRSCQSifvcEzhbu8mrlLPq4+K8FZFIJBKJxC1yzpBQhimheqeG0pzhwPnNZL8jkUgkEonEx3PO7RGq29QSHpYV6VjPIRKJRCKRuDznZKkldHGIm1z/unZHfQ6RSCQSicQNck6dhpiby45DH8/bdldyDpFIJBKJxJU553y33vXiPPJOEdnhrLzhuZxDJBKJRCJxo5wzTB6+Fmp2ZolHziESiUQikbhLzsmmhFafNex5qUMmEolEIpG4X875xU06eefyWJGs7wORSCQSicR9cs4wbuuQY7eHfJPrUIdMJBKJRCJxi5zzzDiIRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSicTvEf8CfP9va5h+WncAAAAASUVORK5CYII=', file: 'catalogo-zahil' };

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const count = document.getElementById('count');
const q = document.getElementById('q');
const filtersBox = document.getElementById('filters');
let filtro = null;

const tipos = [...new Set(VINHOS.map(v => v.tipo))];
tipos.forEach(t => {
  const b = document.createElement('button');
  b.className = 'filter'; b.type = 'button'; b.textContent = t;
  b.setAttribute('aria-pressed', 'false');
  b.onclick = () => {
    filtro = (filtro === t) ? null : t;
    [...filtersBox.children].forEach(c => c.setAttribute('aria-pressed', c.textContent === filtro));
    render();
  };
  filtersBox.appendChild(b);
});

function card(v) {
  const el = document.createElement('article');
  el.className = 'card';
  const safra = v.safra ? ' ' + v.safra : '';
  const img = v.img ? `<img src="${v.img}" alt="">` : '<div></div>';
  el.innerHTML = `
    ${img}
    <div>
      <h2><a href="${v.file}">${v.nome}${safra}</a></h2>
      <p class="prod">${v.produtor}</p>
      <div class="tags">
        <span class="tag">${v.regiao}, ${v.pais}</span>
        <span class="tag">${v.tipo}</span>
        <span class="tag">${v.uva}</span>
      </div>
      ${v.nota ? `<p class="nota">${v.nota}</p>` : ''}
      <div class="actions">
      <button class="act qr" type="button" aria-label="Ver QR code da ficha">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="6.5" height="6.5"/><rect x="14" y="3.5" width="6.5" height="6.5"/><rect x="3.5" y="14" width="6.5" height="6.5"/><path d="M14 14h3v3h-3zM20.5 14v3M17.5 20.5h3M14 20.5h1"/></svg>
        <span>QR</span>
      </button>
      <button class="act share" type="button" aria-label="Copiar link da ficha">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 13.5a4 4 0 0 0 5.7.4l3-3a4 4 0 0 0-5.7-5.7l-1.3 1.3"/><path d="M14 10.5a4 4 0 0 0-5.7-.4l-3 3a4 4 0 0 0 5.7 5.7l1.3-1.3"/></svg>
        <span>Copiar link</span>
      </button>
      </div>
    </div>`;
  el.querySelector('.qr').onclick = (e) => { e.preventDefault(); e.stopPropagation(); abrirQR(v); };
  const btn = el.querySelector('.share');
  btn.onclick = async (e) => {
    e.preventDefault(); e.stopPropagation();
    const url = new URL(v.file, location.href).href;
    const label = btn.querySelector('span');
    try {
      if (navigator.share && matchMedia('(max-width: 860px)').matches) {
        await navigator.share({ title: v.nome, url });
        return;
      }
      await navigator.clipboard.writeText(url);
    } catch (err) {
      const t = document.createElement('textarea');
      t.value = url; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); } catch (e2) {}
      t.remove();
    }
    label.textContent = 'Link copiado';
    setTimeout(() => label.textContent = 'Copiar link', 1800);
  };
  return el;
}

const modal = document.getElementById('qrModal');
function abrirQR(v) {
  document.getElementById('qrTitulo').textContent = v.nome + (v.safra ? ' ' + v.safra : '');
  document.getElementById('qrUrl').textContent = v.url;
  document.getElementById('qrImg').src = v.qr;
  document.getElementById('qrImg').alt = 'QR code da ficha ' + v.nome;
  const a = document.getElementById('qrDownload');
  a.href = v.qr;
  a.download = 'qr-' + v.file.replace('.html', '') + '.png';
  if (typeof modal.showModal === 'function') modal.showModal(); else modal.setAttribute('open', '');
}
document.getElementById('qrFechar').onclick = () => modal.close ? modal.close() : modal.removeAttribute('open');
modal.addEventListener('click', (e) => { if (e.target === modal) modal.close(); });
document.getElementById('qrCatalogo').onclick = () => abrirQR(QR_CATALOGO);

function render() {
  const termo = q.value.trim().toLowerCase();
  const lista = VINHOS.filter(v => {
    if (filtro && v.tipo !== filtro) return false;
    if (!termo) return true;
    return [v.nome, v.produtor, v.regiao, v.pais, v.uva, v.tipo, v.safra, v.mundo, v.nota]
      .join(' ').toLowerCase().includes(termo);
  });
  grid.innerHTML = '';
  lista.forEach(v => grid.appendChild(card(v)));
  empty.hidden = lista.length > 0;
  count.textContent = lista.length === VINHOS.length
    ? `${VINHOS.length} fichas no catálogo`
    : `${lista.length} de ${VINHOS.length} fichas`;
}

q.addEventListener('input', render);
render();
document.getElementById('rodape').textContent = 'Fichas técnicas do portfólio Zahil';
document.getElementById('credito').textContent = 'Desenvolvido por Breno Souto';
</script>
